# /etc/nginx/sites-available/dcs.conf  ->  ln -s vao sites-enabled
# Proxy nguoc cho DCS. Sau khi co ten mien, chay `certbot --nginx` de lay SSL
# mien phi Let's Encrypt (DCS-5 §2b.2). Trang tra cuu QR can HTTPS + ten mien
# thay vi IP tran de nguoi quet bang dien thoai tin tuong.

server {
    listen 80;
    server_name dcs.example.com;   # <-- doi thanh ten mien that

    # Sau khi lay SSL, certbot tu them block 443 va chuyen huong 80 -> 443.

    # Kich thuoc upload: tai lieu PDF co the vai MB.
    client_max_body_size 25m;

    # Diem cuoi MCP cho tac nhan AI (Streamable HTTP, JSON-RPC over POST /mcp).
    # Dat TRUOC `location /` vi nginx match theo prefix — neu khong khoi MCP se
    # roi vao `location /` chung. Gia dinh app chay o ROOT; neu deploy duoi path
    # con (config.basePath = /dcs) thi location phai doi thanh `/dcs/mcp`.
    location /mcp {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chan client ngoai tu dat header danh tinh: xoa truoc khi forward (2.5).
        # Danh tinh chi den tu cookie dcs_sid da ky — client khong gia duoc.
        proxy_set_header X-Dcs-Session "";
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Tai nguyen tinh phuc vu qua ung dung (fastify-static) — de nginx cache nhe.
    location /static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public";
    }
}
